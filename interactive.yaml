apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  generateName: tgoyal-abstention-
  namespace: bonete52

spec:
  queue: bonete52-opp
  minAvailable: 1
  

  tasks:
  - replicas: 1
    name: worker

    template:
      spec:
        schedulerName: volcano
        restartPolicy: Never
        imagePullSecrets:
        - name: dockerhub-creds

        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-vast-bonete52

        containers:
        - name: worker
          image: goyaltanya/abstention:v2

          command:
          - /bin/bash
          - -lc
          - |
            echo started
            nvidia-smi
            while true; do sleep 3600; done

          volumeMounts:
          - name: data
            mountPath: /data

          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "1"
              memory: "4Gi"

            limits:
              nvidia.com/gpu: 1
              cpu: "1"
              memory: "4Gi"
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists

        - effect: NoExecute
          key: node.kubernetes.io/not-ready
          operator: Exists
          tolerationSeconds: 300

        - effect: NoExecute
          key: node.kubernetes.io/unreachable
          operator: Exists
          tolerationSeconds: 300