apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  generateName: tgoyal-tree-multisample-
  namespace: bonete52

spec:
  queue: bonete52
  priorityClassName: high
  minAvailable: 1

  tasks:
  - replicas: 1
    name: worker

    template:
      spec:
        schedulerName: volcano
        priorityClassName: high
        restartPolicy: Never

        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                  - slc01-cl02-hgx-0299

        imagePullSecrets:
        - name: dockerhub-creds

        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-vast-bonete52

        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi

        containers:
        - name: worker
          image: goyaltanya/abstention:v2

          command:
          - /bin/bash
          - -lc
          - source /data/tanyagoyal/models/initialization_script.sh && bash launch_scripts/run_tree_multisample.sh __TASK__ __RUN_ID__ __DATA_NAME__ __GPUS__ __STRIDE__ __NUM_POINTS__ __NUM_SAMPLES__ __SPLIT__

          volumeMounts:
          - name: data
            mountPath: /data

          - name: dshm
            mountPath: /dev/shm

          resources:
            requests:
              nvidia.com/gpu: __GPUS__
              cpu: "8"
              memory: "128Gi"

            limits:
              nvidia.com/gpu: __GPUS__
              cpu: "8"
              memory: "128Gi"
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists

        - effect: NoExecute
          key: node.kubernetes.io/not-ready
          operator: Exists
          tolerationSeconds: 300

        - effect: NoExecute
          key: node.kubernetes.io/unreachable
          operator: Exists
          tolerationSeconds: 300
